<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do Agent</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #1d4ed8;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
    }

    header button {
      background: white;
      color: #1d4ed8;
      border: 0;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    main {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 16px;
      max-width: 1000px;
      margin: 16px auto;
      padding: 0 16px;
    }

    #chat, aside {
      background: white;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    #chat {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 100px);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .user {
      align-self: flex-end;
      background: #1d4ed8;
      color: white;
    }

    .agent {
      align-self: flex-start;
      background: #f1f5f9;
    }

    .error {
      align-self: flex-start;
      background: #fee2e2;
      color: #991b1b;
    }

    .thinking {
      color: #64748b;
      font-style: italic;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e2e8f0;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 44px;
      padding: 10px;
      font: inherit;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    form button {
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: #1d4ed8;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    form button:disabled {
      background: #94a3b8;
      cursor: wait;
    }

    aside {
      padding: 16px;
      align-self: start;
    }

    aside h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    #todos {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #todos li {
      padding: 6px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
    }

    #todos li.done {
      color: #94a3b8;
      text-decoration: line-through;
    }

    .id {
      color: #64748b;
      font-variant-numeric: tabular-nums;
      margin-right: 6px;
    }

    @media (max-width: 700px) {
      main {
        grid-template-columns: 1fr;
      }

      #chat {
        height: 70vh;
      }
    }
  </style>
</head>
<body>
<header>
  <h1>To-Do Agent</h1>
  <button id="new-chat" type="button">New conversation</button>
</header>

<main>
  <section id="chat">
    <div id="messages"></div>
    <form id="form">
      <textarea id="input" placeholder="e.g. Add buy milk" autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </section>

  <aside>
    <h2>Your tasks</h2>
    <ul id="todos"></ul>
  </aside>
</main>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");
  const todosEl = document.getElementById("todos");

  // The conversation id. Kept in the browser so a page reload
  // continues the same conversation.
  function loadThreadId() {
    try {
      let id = localStorage.getItem("threadId");
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem("threadId", id);
      }
      return id;
    } catch {
      return crypto.randomUUID(); // storage blocked: one id per page load
    }
  }

  let threadId = loadThreadId();

  // Add one message bubble. textContent (not innerHTML) means text
  // is shown as text and can never run as code on the page.
  function addMessage(text, kind) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  // Ask the server for the task table and redraw the side panel.
  async function loadTodos() {
    try {
      const res = await fetch("/todos");
      const todos = await res.json();
      todosEl.replaceChildren();

      if (todos.length === 0) {
        const li = document.createElement("li");
        li.textContent = "No tasks yet.";
        todosEl.appendChild(li);
      }

      for (const todo of todos) {
        const li = document.createElement("li");
        if (todo.completed) li.className = "done";

        const id = document.createElement("span");
        id.className = "id";
        id.textContent = "#" + todo.id;

        li.append(id, todo.title);
        todosEl.appendChild(li);
      }
    } catch {
      todosEl.textContent = "Could not load tasks.";
    }
  }

  // Send the message to POST /chat and show the reply.
  async function send(text) {
    addMessage(text, "user");
    const thinking = addMessage("Thinking…", "agent thinking");
    sendButton.disabled = true;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text, threadId}),
      });

      const data = await res.json();
      thinking.remove();

      if (!res.ok) addMessage(data.error ?? "Something went wrong.", "error");
      else addMessage(data.reply, "agent");
    } catch {
      thinking.remove();
      addMessage("Cannot reach the server. Is npm run dev running?", "error");
    } finally {
      sendButton.disabled = false;
      input.focus();
      loadTodos();
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault(); // stop the browser from reloading the page
    const text = input.value.trim();

    if (!text || sendButton.disabled) return;

    input.value = "";
    send(text);
  });

  // Enter sends; Shift+Enter adds a new line.
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  // Start a fresh conversation (the tasks themselves stay).
  document.getElementById("new-chat").addEventListener("click", () => {
    threadId = crypto.randomUUID();
    try {
      localStorage.setItem("threadId", threadId);
    } catch {
    }

    messagesEl.replaceChildren();
    addMessage("New conversation started. Your tasks are still saved.", "agent");
  });

  addMessage("Hi! Tell me what to add, list, complete or delete.", "agent");
  loadTodos();
</script>
</body>
</html>
